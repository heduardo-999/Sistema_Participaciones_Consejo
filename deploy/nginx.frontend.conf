server {
    listen 80;
    listen [::]:80;
    server_name sacadem.esimecu.ipn.mx;

    # Apuntamos a la ruta exacta donde Angular depositó los archivos
    root /usr/share/nginx/html/sistemas-participaciones-front/browser;
    index index.html index.htm;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}