server {
    listen 80;
    listen [::]:80;
    server_name sacadem.esimecu.ipn.mx;

    root /usr/share/nginx/html/sistemas-participaciones-front/browser;
    index index.html index.htm;

    charset utf-8;

    # 1. PRIMERO: Interceptar todo lo que comience con /api/ y mandarlo al backend de Laravel
    location /api/ {
        proxy_pass http://participaciones_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
    }

    # 2. SEGUNDO: El resto del tráfico se lo dejamos a Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}