server {
    listen 80;
    listen [::]:80;
    server_name sacadem.esimecu.ipn.mx;

    root /usr/share/nginx/html/sistemas-participaciones-front/browser;
    index index.html index.htm;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirección automática de la API hacia el contenedor del backend
    location /api/ {
        proxy_pass http://participaciones_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}