server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name sacadem.esimecu.ipn.mx;

    root /usr/share/nginx/html;
    index index.html index.htm;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}